name: unidad-educativa-backups

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unidad_educativa}
      POSTGRES_USER: ${POSTGRES_USER:-unidad_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solo_pruebas_cambiar}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backup:
    image: postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-unidad_educativa}
      POSTGRES_USER: ${POSTGRES_USER:-unidad_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-solo_pruebas_cambiar}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/backup.sh"]

  scheduler:
    image: postgres:17-alpine
    profiles: ["automation"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-unidad_educativa}
      POSTGRES_USER: ${POSTGRES_USER:-unidad_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-solo_pruebas_cambiar}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/scheduler.sh"]

volumes:
  postgres_data:
